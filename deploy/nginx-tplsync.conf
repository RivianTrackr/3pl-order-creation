# /etc/nginx/sites-available/tplsync  (then: ln -s ../sites-available/tplsync /etc/nginx/sites-enabled/)
# Replace orders.example.com, then run: certbot --nginx -d orders.example.com
server {
    listen 80;
    server_name orders.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # "Test a purchase order" can take a few minutes
    }
}
