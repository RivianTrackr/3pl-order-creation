<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · 3PL Order Sync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/static/admin.css?v=13">
  <link rel="icon" href="data:,">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark"><i class="fa-solid fa-boxes-stacked"></i></span>
      <h1>{% block heading %}{% endblock %}</h1>
      <p>{% block intro %}{% endblock %}</p>
    </div>
    {% if error %}<div class="notice notice-error" role="alert"><i class="fa-solid fa-circle-exclamation"></i><span>{{ error }}</span></div>{% endif %}
    {% block form %}{% endblock %}
    <p class="login-foot"><a href="/login"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a></p>
  </main>
</body>
</html>
